multiplePrompt:: |-
  Translate all subtitle lines in the YAML-formatted document below into {{to}}. Insert the translation in the corresponding {{imt_sub_trans_field}} for each entry. 
  
  Important considerations:
  - Always use established standard translations for key terms and phrases, NOT literal translations
  - Preserve the distinctive voices of characters (Tyrion's wit, Cersei's cold formality, Jon's solemn tone)
  - Maintain established translations for recurring terms (house words, greetings, titles)
  - Keep the medieval fantasy tone appropriate to the world of Westeros and Essos
  - Preserve wordplay, metaphors, and cultural references where possible
  - Maintain the emotional impact and subtext of each line
  - Do not include explanations or annotations
  
  Reference terminology (for Chinese example):
  - "Winter is Coming" → "凛冬将至" (NOT "冬天来了")
  - "Valar Morghulis" → "凡人皆有一死" (NOT literal translation)
  - See the standard translation reference for more examples
  
  {{subtitle_result_yaml_example}}
  
  Start:
  {{yaml}}
